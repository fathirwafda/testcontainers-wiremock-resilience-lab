# Local playground: the service, a real PostgreSQL and one WireMock standing in for both providers.
#   docker compose up --build -d --wait
#   curl localhost:3000/health
# WireMock admin UI/API: http://localhost:8080/__admin

name: resilience-lab

services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://checkout:checkout@postgres:5432/checkout
      PAYMENT_BASE_URL: http://wiremock:8080/payment
      PAYMENT_API_KEY: sk_test_local
      SHIPPING_BASE_URL: http://wiremock:8080/shipping
      # Short enough that the "slow" demo stubs trip it.
      PAYMENT_TIMEOUT_MS: '2000'
      SHIPPING_TIMEOUT_MS: '800'
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    ports:
      - '5432:5432'
    tmpfs:
      - /var/lib/postgresql # throwaway data: `down` leaves nothing behind
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U checkout -d checkout']
      interval: 2s
      timeout: 3s
      retries: 20

  wiremock:
    image: wiremock/wiremock:3.13.2
    command: ['--disable-banner']
    ports:
      - '8080:8080'
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:8080/__admin/health || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  default:
    name: resilience-lab
